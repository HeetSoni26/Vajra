name: vajra
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip:
      - torch>=2.3
      - transformers>=4.40
      - tokenizers>=0.19
      - datasets>=2.19
      - safetensors>=0.4
      - numpy>=1.26
      - pyyaml>=6.0
      - tqdm>=4.66
      - pydantic>=2.0
      - pydantic-settings>=2.0
      - requests>=2.28
      - fastapi>=0.111
      - uvicorn>=0.29
      - pytest>=8
      - ruff>=0.4
      - -e .[all]
