[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra-lm"
version = "1.0.0"
description = "Vajra v1.0.0 - A 1B-2B open-source foundation language model and autonomous agent framework."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.40",
  "tokenizers>=0.19",
  "datasets>=2.19",
  "safetensors>=0.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7"]
testing = ["pytest>=8"]
training = ["accelerate>=0.30", "wandb>=0.17", "zstandard>=0.22", "pyarrow>=16"]
deepspeed = ["deepspeed>=0.14"]
docs = ["mkdocs>=1.5"]
data = ["datasketch>=1.6", "ftfy>=6.2", "trafilatura>=1.9", "datatrove>=0.3"]
serve = ["fastapi>=0.111", "uvicorn>=0.29", "httpx>=0.27", "gradio>=4.0", "huggingface-hub>=0.20"]
align = ["trl>=0.8"]
eval = ["lm-eval>=0.4"]
all = [
  "vajra-lm[dev,testing,training,docs,data,serve,align,eval]",
]

[project.scripts]
vajra-lm = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "cli*", "dataset*", "evaluation*", "experiments*", "inference*", "model*", "release*", "tokenizer*", "training*", "utils*", "vajra_agent*"]
exclude = ["tests*", "docs*", "benchmarks*", "deployment*", "notebooks*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
