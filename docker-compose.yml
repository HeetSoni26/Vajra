services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - MODEL_PATH=/app/model_weights
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    ipc: host
    shm_size: "16gb"
    restart: "no"
    environment:
      - WANDB_MODE=offline
