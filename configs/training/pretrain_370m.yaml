# Vajra-370M Pretraining Configuration
# Target: ~15B tokens (Chinchilla-optimal for ~370M params)
# Suitable for: 4x A100 80GB (DDP) or 8x RTX A6000
model_config: configs/model/model_370m.yaml
data_dir: data/tokenized
output_dir: checkpoints/pretrain_370m
tokenizer_path: tokenizer/v1.0
sequence_length: 4096
global_batch_tokens: 1048576
micro_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 3.0e-4
min_learning_rate: 3.0e-5
warmup_steps: 2000
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
grad_clip: 1.0
max_steps: 100000
max_tokens: 15000000000
save_every_steps: 2000
eval_every_steps: 1000
precision: bf16
scheduler: cosine
wandb_project: vajra-lm-370m
