model_config: configs/model/model_tiny.yaml
data_dir: data/tokenized
output_dir: checkpoints/pretrain_tiny
sequence_length: 128
micro_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-3
min_learning_rate: 1.0e-4
warmup_steps: 10
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
grad_clip: 1.0
max_steps: 50
save_every_steps: 10
eval_every_steps: 10
precision: float32
