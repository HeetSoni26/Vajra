# Vajra-125M Pretraining Configuration
# ~125M parameters, suitable for initial training experiments
model_config: configs/model/model_125m.yaml
data_dir: data/tokenized
output_dir: checkpoints/pretrain_125m
tokenizer_path: tokenizer/v1.0
sequence_length: 2048
global_batch_tokens: 524288
micro_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 6.0e-4
min_learning_rate: 6.0e-5
warmup_steps: 500
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
grad_clip: 1.0
max_steps: 50000
max_tokens: 5000000000
save_every_steps: 2000
eval_every_steps: 500
precision: bf16
wandb_project: vajra-lm-125m
