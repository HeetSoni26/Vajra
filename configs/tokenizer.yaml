input_glob: data/tokenizer_corpus/*.jsonl
output_dir: tokenizer/v1.0
vocab_size: 65536
min_frequency: 2
special_tokens:
  - "<|pad|>"
  - "<|bos|>"
  - "<|eos|>"
  - "<|unk|>"
  - "<|sep|>"
  - "<|sys|>"
  - "<|user|>"
  - "<|assistant|>"
  - "<|code|>"
  - "<|endcode|>"
  - "<|math|>"
  - "<|endmath|>"
