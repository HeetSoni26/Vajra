# Vajra-370M Model Configuration
# ~370M parameters | Production pretraining target
# vocab_size aligned to tokenizer/v1.0 (65536 BPE tokens)
model_name: vajra-lm-370m
vocab_size: 65536
hidden_size: 1024
num_layers: 24
num_attention_heads: 16
num_key_value_heads: 4
intermediate_size: 4096
max_position_embeddings: 4096
rope_theta: 10000.0
rms_norm_eps: 1.0e-6
tie_word_embeddings: false
use_flash_attention: false
