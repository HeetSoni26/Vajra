# Dedicated validation model configuration for Phase 6
# Intentionally lightweight for fast offline verification on CPU/GPU
model_name: vajra-lm-tiny-validation
vocab_size: 297
hidden_size: 64
num_layers: 2
num_attention_heads: 2
num_key_value_heads: 2
intermediate_size: 128
max_position_embeddings: 128
rope_theta: 10000.0
rms_norm_eps: 1.0e-6
tie_word_embeddings: true
use_flash_attention: false
